[settings]
chunk_processor_type = "DynamicCheckerboard"
analytics_type = "ColorHistogram"
filter_chain = ["Ema", "Gamma"]
hardware_output_type = "SerialDriver"
log_level = "Info"

[frame_connection_config]
start_from = "Left"
direction = "Clockwise"

[screen_config]
frame_width_mm = 590
frame_height_mm = 330

[led_position_config]
gap = 5
vertical_offset = 15
horizontal_offset = 20
led_length = 62
vertical_led_amount = 5
horizontal_led_amount = 9

[checkerboard_config]
pixel_step = 10
row_stride = 5

[gamma_filter_config]
gamma = 2.200000047683716

[screen_reading_config]
deep_in = 25
deep_out = 0

[ema_filter_config]
alpha = 0.05000000074505806

[color_histogram_config]
precision_level = 20

[dynamic_checkerboard_config]
pixel_step = 10
row_stride = 5
column_crawl = 2
row_crawl = 1

[serial_driver_config]
port_path = "/dev/ttyUSB0"
baud_rate = 115200
