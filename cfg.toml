[settings]
chunk_processor_type = "CrawlCheckerboard"
analytics_type = "Histogram"
filter_chain = [
    "Ema",
    "Gamma",
]
hardware_output_type = "Debug"

[frame_connection_config]
start_from = "Left"
direction = "Clockwise"

[screen_config]
frame_width_px = 0
frame_height_px = 0
frame_width_mm = 590
frame_height_mm = 330

[led_position_config]
gap = 5
led_length = 62
vertical_led_amount = 5
horizontal_led_amount = 9

[checkerboard_config]
pixel_step = 10
row_stride = 5

[checkerboard_config.config]
width = 0
height = 0

[gamma_filter_config]
gamma = 2.200000047683716

[screen_reading_config]
deep_in = 25
deep_out = 0

[ema_filter_config]
alpha = 0.05000000074505806

[color_histogram_config]
precision_level = 20

[crawl_checkerboard_config]
pixel_step = 10
row_stride = 5
column_crawl = 2
row_crawl = 1

[crawl_checkerboard_config.config]
width = 0
height = 0

[serial_driver_config]
port_path = "/dev/ttyUSB0"
baud_rate = 115200

[ema_config]
alpha = 0.5

[gamma_config]
gamma = 2.200000047683716

[histogram_config]
precision_level = 14

[daemon_settings]
log_level = "Off"
pipewire_conversion = false
save_token = true
