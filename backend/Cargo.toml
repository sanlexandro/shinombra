[package]
name = "ambient-lighting"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Async runtime
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Utils
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
pkg-config = "0.3"

[[bin]]
name = "ambient-lighting"
path = "src/main.rs"
